@media (prefers-color-scheme: dark){

    --bg:#0E1322; --surface:#171E35; --ink:#EDF0F8; --muted:#A0ABC8; --line:#2A3558;

}

  color-scheme:dark;
}
*{box-sizing:border-box}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;flex-direction:column;gap:8px;padding-block:10px;border-bottom:1px solid var(--line)}

.brand{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em}
.tag{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
main{display:block;padding-top:20px}
.screen{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.02em}
h1{font-size:clamp(40px,12vw,56px);line-height:1;font-weight:800}
h2{font-size:28px;line-height:1.1;font-weight:800}
h3{font-size:18px;font-weight:700}
p{margin:0}
.lead{font-size:18px;color:var(--muted);max-width:34ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.btn{appearance:none;border:0;cursor:pointer;width:100%;min-height:56px;padding:12px 18px;border-radius:14px;font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15;background:var(--accent);color:var(--accent-ink);text-wrap:balance}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.soft{background:var(--accent-soft);color:var(--ink);border:2px solid var(--accent)}
.btn.wide{width:100%}
.btn.sm{width:auto;min-height:42px;padding:8px 14px;font-size:15px;border-radius:12px}
.btn:focus-visible,.field:focus-visible,.opt:focus-visible,.x:focus-visible,summary:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.field{width:100%;min-height:56px;padding:10px 14px;font:inherit;font-size:20px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px}

.row{display:flex;gap:10px;align-items:stretch}
.row .field{flex:1;min-width:0}
.row .btn{width:auto;flex:none}
.label{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.counter{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.msg{font-size:15px;font-weight:500;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.info{background:var(--accent-soft);color:var(--ink);margin-bottom:12px}
.players{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.players li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.players .n{font-family:var(--font-display);font-weight:800;color:var(--accent);min-width:1.5ch;font-variant-numeric:tabular-nums}
.players .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
.x{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;width:36px;height:36px;border-radius:10px;font-size:22px;line-height:1}
.opts{display:grid;gap:10px}
.opt{appearance:none;cursor:pointer;text-align:left;width:100%;min-height:60px;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:22px;text-transform:capitalize}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}

.pct{font-family:var(--font-display);font-weight:800;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.pct small{font-size:32px}
.meter{position:relative;height:16px;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter::after{content:"";position:absolute;left:90%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}

.fill.low{background:var(--bad)} .fill.mid{background:var(--warn)} .fill.high{background:var(--good)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-variant-numeric:tabular-nums;max-width:100%;overflow-wrap:anywhere}
.chip b{font-weight:700}
.score{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.score li{display:grid;grid-template-columns:2ch 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.score li:last-child{border-bottom:0}
.score .r{font-family:var(--font-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.score .nm{min-width:0;overflow-wrap:anywhere;font-weight:500}
.score .pt{font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);font-variant-numeric:tabular-nums}
.score .delta.none{visibility:hidden}
.delta.neg{background:var(--bad-soft);color:var(--bad)}
.guess{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.guess .who{font-weight:700;min-width:0;overflow-wrap:anywhere}
.guess .what{color:var(--muted);overflow-wrap:anywhere}
.guess.ok{border-color:var(--good);background:var(--good-soft)}
.verdict{font-weight:700;white-space:nowrap}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--bad)}

.modal{position:fixed;inset:0;z-index:30;background:rgba(10,14,28,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.modal .card{width:100%;max-width:420px;text-align:center;align-items:stretch}

function norm(s){
  return String(s == null ? '' : s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a,b){
  var m=a.length,n=b.length;
  if(!m) return n; if(!n) return m;
  var prev=[],j,i;
  for(j=0;j<=n;j++) prev[j]=j;
  for(i=1;i<=m;i++){
    var cur=[i];
    for(j=1;j<=n;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[n];
}
function hsh(s){ var x=5381,i; for(i=0;i<s.length;i++) x=((x<<5)+x+s.charCodeAt(i))|0; return Math.abs(x); }
/* Chave de pronúncia do português: palavras com o mesmo som ficam com a mesma chave */
function phon(s){
  var t=String(s==null?'':s).toLowerCase().replace(/ç/g,'ss');
  t=norm(t).replace(/ /g,'');
  if(!t) return '';
  t=t.replace(/ph/g,'f').replace(/ch/g,'x').replace(/lh/g,'L').replace(/nh/g,'N')
     .replace(/qu(?=[ei])/g,'k').replace(/gu(?=[ei])/g,'g')
     .replace(/rr/g,'R').replace(/ss/g,'S').replace(/(?:s|x)c(?=[ei])/g,'S')
     .replace(/c(?=[ei])/g,'S').replace(/[cq]/g,'k')
     .replace(/g(?=[ei])/g,'j').replace(/h/g,'')
     .replace(/^r/,'R').replace(/([nls])r/g,'$1R')
     .replace(/([aeiou])s(?=[aeiou])/g,'$1z').replace(/z$/,'S')
     .replace(/w/g,'u').replace(/y/g,'i')
     .replace(/o$/,'u').replace(/e$/,'i').replace(/l$/,'u')
     .replace(/(.)\1+/g,'$1');
  return t.replace(/S/g,'s');
}
function dice(a,b){
  if(a.length<2||b.length<2) return a===b?1:0;
  var m={},i,hit=0,g;
  for(i=0;i<a.length-1;i++){ g=a.substr(i,2); m[g]=(m[g]||0)+1; }
  for(i=0;i<b.length-1;i++){ g=b.substr(i,2); if(m[g]>0){ m[g]--; hit++; } }
  return 2*hit/((a.length-1)+(b.length-1));
}

function stemMatch(t,w,min,maxd){
  var p=0; while(p<t.length && p<w.length && t[p]===w[p]) p++;
  var sh=Math.min(t.length,w.length);
  return (sh>=3 && (p>=4 || (sh<=4 && p>=3)) && p/sh>=(min||0.75) && Math.abs(t.length-w.length)<=(maxd||3)) ? p/sh : 0;
}
function stemScore(t,w){
  var r=stemMatch(t,w); if(!r) return 0;
  var sh=Math.min(t.length,w.length), j=(hsh(t+'|'+w)%3)-1;
  return Math.max(88,Math.min(99,(sh<=4 ? 88+Math.round(r*7) : 94+Math.round(r*4))+j));
}
function termsOf(entry){
  var out=[];
  if(!entry) return out;
  KEYS.forEach(function(k,i){
    var str=entry[2+i]; if(!str) return;
    var raws=str.split(/\s+/).filter(Boolean), n=raws.length, hi=RANGE[k][0], lo=RANGE[k][1];
    raws.forEach(function(raw,idx){
      var m=raw.match(/^(.+?):(\d+)$/), v;
      if(m){ raw=m[1]; v=Math.min(99,+m[2]); }
      else{
        v=hi-(hi-lo)*(n>1?idx/(n-1):0)+(hsh(entry[0]+'|'+raw)%3)-1;
        v=Math.max(lo,Math.min(hi,Math.round(v)));
      }
      var t=norm(raw).replace(/ /g,'');
      if(t) out.push({t:t,p:v,k:k});
    });
  });
  var seen={}, wn=norm(entry[0]).replace(/ /g,''); out.forEach(function(x){ seen[x.t]=1; });
  (entry[6]||'').split(/\s+/).forEach(function(bd){
    var key=norm(bd).replace(/ /g,''), list=CATS[key]; if(!list) return;
    var gs=list.split(' '), n=gs.length;
    gs.forEach(function(g,idx){
      var t=norm(g).replace(/ /g,''); if(!t||seen[t]||t===wn||stemMatch(t,wn)) return;
      seen[t]=1;
      out.push({t:t,p:Math.round(48-14*(n>1?idx/(n-1):0))+(hsh(entry[0]+'|'+t)%3)-1,k:'broad',g:true});
    });
  });
  return out;
}
function phonScore(t,w){
  if(t.length<3||w.length<3) return 0;
  var a=phon(t), b=phon(w);
  if(!a||!b) return 0;
  if(a===b) return 91+(hsh(t+'|'+w)%5);
  var r=1-lev(a,b)/Math.max(a.length,b.length);
  return (r>=0.75 && Math.min(a.length,b.length)>=3) ? 70+Math.round((r-0.75)/0.25*15) : 0;
}
/* O robô. Nunca devolve menos de 3%.
   100 própria palavra | 93 a 98 sinônimo | 90 a 97 característica muito específica
   80 a 92 característica que define a coisa | 70 a 84 antônimo | 91 a 95 som igual, 70 a 85 som parecido
   52 a 78 associada | 30 a 55 relação ampla | 3 a 18 sem relação nenhuma */
function localScore(clue,word,hint,entry,all){
  var c=norm(clue), w=norm(word).replace(/ /g,'');
  if(!c) return {pct:3,kind:'floor',exact:false};
  var toks=c.split(' '), sq=c.replace(/ /g,'');
  if(sq===w || toks.some(function(t){return t===w||t===w+'s'||t===w+'es';})) return {pct:100,kind:'exact',exact:true};
  if(hint && sq===norm(hint).replace(/ /g,'')) return {pct:99,kind:'syn',exact:false};
  var terms=termsOf(entry), cands=toks.length>1?[sq].concat(toks):toks;
  var best=0, kind='floor', matched={};
  function take(p,k){ if(p>best){ best=p; kind=k; } }
  cands.forEach(function(t){
    take(stemScore(t,w),'stem');
    take(phonScore(t,w),'phon');
    var r2=1-lev(t,w)/Math.max(t.length,w.length);
    if(r2>=0.6) take(Math.round(r2*60),'sim');
    terms.forEach(function(x){
      var hit=0;
      if(t===x.t||t===x.t+'s'||t===x.t+'es') hit=x.p;
      else if(t.length>=4 && stemMatch(t,x.t,0.85,2)) hit=Math.max(1,x.p-(Math.abs(t.length-x.t.length)<=1?1:3));
      if(hit){
        take(hit,x.k);
        if(toks.length===1 || t!==sq) matched[x.t]=Math.max(matched[x.t]||0,hit);
      }
    });
  });
  /* mais de uma característica na mesma dica deixa a dica mais específica */
  var vals=Object.keys(matched).map(function(k){return matched[k];}).filter(function(v){return v>=40;});
  if(vals.length>1 && kind!=='syn' && kind!=='ant' && best<97) best=Math.min(98,best+Math.min(8,(vals.length-1)*4));
  /* parente distante: a dica é outra palavra do jogo que divide termos com esta */
  if(best<45 && all){
    var mine={}; terms.forEach(function(x){ if(!x.g) mine[x.t]=1; });
    all.forEach(function(e){
      if(e[0]===word) return;
      var ew=norm(e[0]).replace(/ /g,'');
      if(!cands.some(function(t){return t===ew||t===ew+'s';})) return;
      var shared=0; termsOf(e).forEach(function(x){ if(!x.g && mine[x.t]) shared++; });
      if(shared) take(Math.min(58,24+4*shared+(hsh(sq+'|'+word)%6)),'rel');
    });
  }
  /* piso: nunca 0%. Sem relação nenhuma fica entre 3% e 18%, variando com a escrita */
  var fl=3+Math.round(dice(sq,w)*8)+(hsh(sq+'|'+w)%8);
  if(fl>best){ best=fl; kind='floor'; }
  return {pct:Math.max(3,Math.min(99,Math.round(best))),kind:kind,exact:false};
}
function isCorrect(guess,word){
  var g=norm(guess).replace(/ /g,''), w=norm(word).replace(/ /g,'');
  if(!g) return false;
  if(g===w || g===w+'s' || g===w+'es') return true;
  return w.length>=6 && lev(g,w)<=1;
}

var KNOWN=null, KLIST=null;
function buildKnown(words){
  KNOWN={};
  function add(str){ norm(str).split(' ').forEach(function(x){ if(x) KNOWN[x]=1; }); }
  (words||[]).forEach(function(e){ e.forEach(function(f){ if(typeof f==='string') add(f.replace(/:\d+/g,'')); }); });
  for(var k in CATS){ if(typeof CATS[k]==='string') add(CATS[k]); }
  add(COMMON); add(LOAN);
  KLIST=Object.keys(KNOWN);
}
function singular(t){
  if(/(oes|aes|aos)$/.test(t)) return t.slice(0,-3)+'ao';
  if(/ais$/.test(t)) return t.slice(0,-2)+'l';
  if(/eis$/.test(t)) return t.slice(0,-3)+'el';
  if(/(res|zes|ses)$/.test(t)&&t.length>4) return t.slice(0,-2);
  if(/s$/.test(t)&&t.length>3) return t.slice(0,-1);
  return t;
}
function isKnown(t){
  if(KNOWN[t]) return true;
  var v=[singular(t)];
  if(/(a|o)$/.test(t)) v.push(t.slice(0,-1)+(t.slice(-1)==='a'?'o':'a'));
  if(/(as|os)$/.test(t)) v.push(t.slice(0,-2)+'o', t.slice(0,-2)+'a');
  if(/mente$/.test(t)) v.push(t.slice(0,-5));
  if(/(inho|inha)s?$/.test(t)) v.push(t.replace(/(inho|inha)s?$/,'o'), t.replace(/(inho|inha)s?$/,'a'));
  return v.some(function(x){ return KNOWN[x]; });
}
var KEYROW=/qwer|wert|erty|rtyu|tyui|yuio|uiop|asdf|sdfg|dfgh|fghj|ghjk|hjkl|zxcv|xcvb|cvbn|vbnm/;
var MASH3={qwe:1,wer:1,ert:1,rty:1,tyu:1,yui:1,uio:1,iop:1,asd:1,sdf:1,dfg:1,fgh:1,ghj:1,hjk:1,jkl:1,zxc:1,xcv:1,cvb:1,vbn:1,bnm:1};
function badWord(t){
  if(isKnown(t)) return false;
  if(t.length<2||t.length>22) return true;
  if(!/[aeiou]/.test(t)) return true;
  if(/(.)\1\1/.test(t)) return true;
  if(/[^aeiou]{5,}/.test(t)) return true;
  if(KEYROW.test(t)||MASH3[t]) return true;
  if(/[bcdfghjkpqtvwy]$/.test(t)) return true;
  if(t.length>=4){
    for(var i=0;i<KLIST.length;i++){ var k=KLIST[i]; if(k.length>t.length && k.length<=t.length+3 && k.indexOf(t)===0) return true; }
  }
  return false;
}
function sameFamily(a,b){
  a=singular(a); b=singular(b);
  if(a===b) return true;
  var m=Math.min(a.length,b.length), M=Math.max(a.length,b.length);
  if(m<3) return false;
  if((a.indexOf(b)===0||b.indexOf(a)===0) && M-m<=4) return true;
  if(a.length===b.length && a.slice(0,-1)===b.slice(0,-1) && /[ao]$/.test(a) && /[ao]$/.test(b)) return true;
  return false;
}
/* devolve '' se a dica pode seguir, ou a mensagem do problema */
function checkClue(raw,prev,words){
  if(!KNOWN) buildKnown(words);
  var ts=norm(raw).split(' ').filter(function(x){return x&&!STOPW[x];});
  if(!ts.length) return 'Escreva uma palavra de verdade na dica.';
  for(var i=0;i<ts.length;i++){
    if(badWord(ts[i])) return '"'+ts[i]+'" não parece uma palavra que existe. Escreva palavras completas. Essa tentativa não foi gasta.';
  }
  for(var j=0;j<(prev||[]).length;j++){
    var pt=norm(prev[j]).split(' ').filter(function(x){return x&&!STOPW[x];});
    for(var a=0;a<ts.length;a++) for(var b=0;b<pt.length;b++){
      if(sameFamily(ts[a],pt[b])) return 'Essa dica repete ou contém uma que já foi dada ("'+prev[j]+'"). Tente outra, ela não gasta tentativa.';
    }
  }
  return '';
}

/* a partida salva vale por 10 minutos depois da última jogada ou de sair da página */
function loadSaved(){
  try{
    var s=localStorage.getItem(KEY); if(!s) return null;
    var o=JSON.parse(s);
    if(!o || !Array.isArray(o.players) || !o.players.length || typeof o.phase!=='string' || o.phase==='home') return null;
    if(!o.ts || Date.now()-o.ts>TTL){ localStorage.removeItem(KEY); return null; }
    return o;
  }catch(e){}
  return null;
}

/* ---------- helpers de DOM ---------- */
function h(tag,props){
  var e=document.createElement(tag), i, k;
  if(props){
    for(k in props){
      var v=props[k];
      if(v===false||v==null) continue;
      if(k==='class') e.className=v;
      else if(k==='on'){ for(var ev in v) e.addEventListener(ev,v[ev]); }
      else if(k==='disabled'||k==='checked'||k==='hidden') e[k]=!!v;
      else e.setAttribute(k,v===true?'':v);
    }
  }
  for(i=2;i<arguments.length;i++){
    var c=arguments[i]; if(c==null||c===false) continue;
    e.append(c.nodeType?c:document.createTextNode(String(c)));
  }
  return e;
}
function btn(text,onclick,cls,extra){
  var p={type:'button',class:'btn'+(cls?' '+cls:''),on:{click:onclick}};
  if(extra) for(var k in extra) p[k]=extra[k];
  return h('button',p,text);
}
function go(phase){ G.phase=phase; save(); render(); }
function others(){ var n=G.players.length,a=[],i; for(i=1;i<n;i++) a.push((G.turn+i)%n); return a; }
function giver(){ return G.players[G.turn]; }
function pctBand(p){ return p>=OK?'high':p>=60?'mid':'low'; }
function pctLabel(p){ return p>=95?'Dica excelente':p>=90?'Dica muito boa':p>=80?'Quase lá':p>=70?'Perto':p>=50?'Morna':p>=25?'Fria':p>=10?'Muito fria':'Quase nada a ver'; }
function meter(p){
  var fill=h('div',{class:'fill '+pctBand(p)});
  var m=h('div',{class:'meter',role:'img','aria-label':p+' por cento'},fill);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ fill.style.width=p+'%'; }); });
  return m;
}
function entryOf(word){ for(var i=0;i<WORDS.length;i++) if(WORDS[i][0]===word) return WORDS[i]; return null; }
function hintOf(word){ var e=entryOf(word); return e?e[1]:''; }

/* ---------- análise da dica ---------- */
async function scoreClue(clue,word,hint,entry){
  var r=localScore(clue,word,hint,entry,WORDS);
  return {pct:r.pct,method:r.exact?'exact':'lex',kind:r.kind};
}

/* ---------- fluxo ---------- */
function startRegister(){ G=fresh(); notice=''; go('register'); }
function addPlayer(name){
  name=name.replace(/\s+/g,' ').trim();
  if(!name) return;
  if(G.players.length>=10){ notice='O limite é 10 jogadores.'; return render(); }
  if(G.players.some(function(p){return p.name.toLowerCase()===name.toLowerCase();})){ notice='Já existe um jogador chamado '+name+'. Use outro nome.'; return render(); }
  G.players.push({name:name,score:0}); notice=''; save(); render();
}
function startGame(){
  if(G.players.length<2||G.players.length>10) return;
  G.players.forEach(function(p){p.score=0;});
  G.round=1; G.turn=0; G.used=[]; go('turnIntro');
}
function beginTurn(){
  var pool=WORDS.map(function(w){return w[0];}).filter(function(w){return G.used.indexOf(w)<0;});
  if(pool.length<5){ G.used=[]; pool=WORDS.map(function(w){return w[0];}); }
  var opts=[];
  while(opts.length<5){ var i=Math.floor(Math.random()*pool.length); opts.push(pool.splice(i,1)[0]); }
  G.options=opts; G.picked=null; go('pick');
}
function confirmWord(){
  if(!G.picked) return;
  G.word=G.picked; G.hint=hintOf(G.word); G.used.push(G.word);
  G.attempts=[]; G.last=null; G.byApp=false; G.clues=[]; G.twoMid=false; G.pending=false; notice=''; go('clue');
}
async function submitClue(text){
  if(busy) return;
  var raw=text.replace(/\s+/g,' ').trim();
  if(!raw) return;
  var bad=checkClue(raw,G.attempts.map(function(a){return a.clue;}),WORDS);
  if(bad){ notice=bad; return render(); }
  busy=true; notice=''; render();
  var res=await scoreClue(raw,G.word,G.hint,entryOf(G.word));
  busy=false;
  if(res.pct>=100){ notice='Essa dica é a própria palavra, não vale. Tente outra, ela não gasta tentativa.'; return render(); }
  G.attempts.push({clue:raw,pct:res.pct});
  G.last={clue:raw,pct:res.pct,method:res.method,kind:res.kind,app:false};
  var mids=G.attempts.filter(function(a){return a.pct>50;});
  if(mids.length>=2){ G.clues=[mids[0].clue,mids[1].clue]; G.twoMid=true; G.pending=true; }
  save(); render();
}
function endClues(){ G.pending=false; go('clueOk'); }
function nextClue(){ G.last=null; notice=''; save(); render(); }
function appGivesClue(){
  var mids=G.attempts.filter(function(a){return a.pct>50;});
  var valid=G.attempts.some(function(a){return a.pct>=OK;});
  G.clues=mids.map(function(a){return a.clue;});
  G.byApp=!valid; G.twoMid=true;
  if(!valid) G.clues.push(G.hint);
  go('clueOk');
}
function callGuessers(){ G.guessers=others(); G.gpos=0; G.guesses=[]; go('pass'); }
function submitGuess(text){
  var t=text.replace(/\s+/g,' ').trim(); if(!t) return;
  G.guesses.push({i:G.guessers[G.gpos],text:t,ok:isCorrect(t,G.word)});
  G.gpos++;
  if(G.gpos<G.guessers.length){ go('pass'); } else { finishGuessing(); }
}
function finishGuessing(){
  G.gains=G.players.map(function(){return 0;});
  var right=0;
  G.guesses.forEach(function(g){ if(g.ok){ right++; G.gains[g.i]+=2; } });
  if(!G.byApp){
    G.gains[G.turn]+=3-right;
  }
  G.players.forEach(function(p,i){ p.score+=G.gains[i]; });
  go('reveal');
}
function nextTurn(){
  G.turn++; G.gains=[];
  if(G.turn<G.players.length) go('turnIntro'); else go('roundEnd');
}
function newRound(){ G.round++; G.turn=0; G.gains=[]; go('turnIntro'); }
function changePlayers(){ var names=G.players.map(function(p){return p.name;}); G=fresh(); G.players=names.map(function(n){return {name:n,score:0};}); go('register'); }

  var ol=h('ol',{class:'score'});

}

      s.append(h('div',null,h('div',{class:'label'},'Dicas anteriores'),chips));
    }
    s.append(h('p',{class:'small muted'},'São precisas 2 dicas acima de 50% (uma de 90% ou mais conta como uma). Se nenhuma chegar a 90% até a 7ª, o app dá uma dica 99%.'));
    return s;
  },
  clueOk:function(){
    var s=h('section',{class:'screen'});
    s.append(G.twoMid?midCard():resultCard());
    if(G.byApp) s.append(h('p',{class:'small muted'},'Como a dica foi do app, quem dava as dicas não ganha nem perde pontos nesta vez. Quem acertar ganha 2.'));
    var first=G.players[others()[0]].name;
    s.append(btn('Chamar '+first+' para adivinhar',callGuessers));
    return s;
  },
  pass:function(){
    var s=h('section',{class:'screen'}), p=G.players[G.guessers[G.gpos]];
    s.append(h('div',{class:'tag'},'Adivinhador '+(G.gpos+1)+' de '+G.guessers.length));
    s.append(h('div',{class:'card'},
      h('div',{class:'label'},'Passe o celular para'),
      h('div',{class:'bigname'},p.name),
      h('p',{class:'muted'},'Quem já palpitou não mostra a resposta a ninguém.'),
      btn('Sou '+p.name+': escrever palpite',function(){ go('guess'); })
    ));
    return s;
  },
  guess:function(){
    var s=h('section',{class:'screen'}), p=G.players[G.guessers[G.gpos]];
    s.append(h('div',{class:'tag'},p.name+' · palpite '+(G.gpos+1)+' de '+G.guessers.length));
    s.append(h('div',{class:'card'},h('div',{class:'label'},G.clues&&G.clues.length>1?'As dicas são':'A dica é'),clueBlock()));
    var input=h('input',{class:'field',id:'guessInput',maxlength:'30',autocomplete:'off',autocapitalize:'none',spellcheck:'false',placeholder:'Qual é a palavra?','aria-label':'Seu palpite','data-autofocus':'1'});
    input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); submitGuess(input.value); } });
    s.append(h('div',{class:'card'},h('label',{class:'label',for:'guessInput'},'Seu palpite'),input,h('button',{type:'button',class:'btn',on:{click:function(){ submitGuess(input.value); }}},'Confirmar palpite')));
    return s;
  },
  reveal:function(){
    var s=h('section',{class:'screen'}), anyOk=G.guesses.some(function(g){return g.ok;});
    s.append(h('div',{class:'card'},h('div',{class:'label'},'A palavra era'),h('div',{class:'secret',style:'text-align:left'},G.word),h('p',{class:'muted'},(G.clues&&G.clues.length>1?'Dicas: ':'Dica: ')+clueList())));
    var box=h('div',{class:'screen',style:'gap:8px'});
    G.guesses.forEach(function(g){
      box.append(h('div',{class:'guess'+(g.ok?' ok':'')},
        h('div',{style:'min-width:0'},h('div',{class:'who'},G.players[g.i].name),h('div',{class:'what'},g.text)),
        h('span',{class:'verdict '+(g.ok?'ok':'no')},g.ok?'Acertou +2':'Errou')));
    });
    s.append(box);
    var allOk=G.guesses.every(function(g){return g.ok;});
    var nOk=G.guesses.filter(function(g){return g.ok;}).length, dg=3-nOk;
    if(G.byApp) s.append(h('div',{class:'msg'},(nOk?nOk+(nOk===1?' pessoa acertou':' pessoas acertaram'):'Ninguém acertou')+'. Como a dica foi do app, '+giver().name+' não pontua.'));
    else s.append(h('div',{class:'msg'},(nOk?nOk+(nOk===1?' pessoa acertou':' pessoas acertaram'):'Ninguém acertou')+': 3 \u2212 '+nOk+' = '+(dg<0?'\u2212'+Math.abs(dg):dg)+(Math.abs(dg)===1?' ponto':' pontos')+' para '+giver().name+'.'));
    s.append(h('div',{class:'card'},h('h3',null,'Pontuação'),scoreboard(true)));
    var last=G.turn+1>=G.players.length;
    s.append(btn(last?'Ver fim da rodada':'Próximo: '+G.players[G.turn+1].name,nextTurn));
    return s;
  },
  roundEnd:function(){
    var s=h('section',{class:'screen'});
    var top=Math.max.apply(null,G.players.map(function(p){return p.score;}));
    var win=G.players.filter(function(p){return p.score===top;}).map(function(p){return p.name;});
    s.append(h('div',{class:'tag'},'Fim da rodada '+G.round));
    s.append(h('h2',null,win.length>1?'Empate na frente: '+win.join(', '):win[0]+' lidera com '+top+' pontos'));
    s.append(h('div',{class:'card'},h('h3',null,'Pontuação'),scoreboard(false)));
    s.append(btn('Nova rodada (a pontuação continua)',newRound));
    s.append(btn('Trocar jogadores',changePlayers,'ghost'));
    s.append(btn('Voltar ao início',function(){ G=fresh(); saved=null; try{localStorage.removeItem(KEY);}catch(e){} go('home'); },'ghost'));
    return s;
  }
};

function render(){
  var v=document.getElementById('view'), extra=document.getElementById('topExtra'), rt=document.getElementById('roundTag');
  v.replaceChildren(SCREENS[G.phase]());
  if(resumeMsg){ v.prepend(h('div',{class:'msg info',role:'status'},resumeMsg)); resumeMsg=''; }
  rt.textContent=(G.players.length && G.phase!=='home' && G.phase!=='register')?'Rodada '+G.round:'';
  extra.replaceChildren();
  if(G.phase==='clue'||G.phase==='clueOk') extra.append(btn('Consultar palavra',openWord,'sm soft wide'));
  window.scrollTo(0,0);
  var f=v.querySelector('[data-autofocus]');
  if(f && !busy) setTimeout(function(){ try{ f.focus(); }catch(e){} },30);
}

/* ---------- consultar palavra ---------- */
var modal=document.getElementById('modal');
function openWord(){
  document.getElementById('secretWord').textContent=G.word;
  modal.hidden=false;
  document.getElementById('closeModal').focus();
}
function closeWord(){ modal.hidden=true; document.getElementById('secretWord').textContent=''; }
document.getElementById('closeModal').addEventListener('click',closeWord);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ if(!modal.hidden) closeWord(); if(!rmodal.hidden) closeRestart(); } });

/* ---------- começar de novo (sempre disponível) ---------- */
var rmodal=document.getElementById('restartModal');
function openRestart(){
  document.getElementById('restartKeep').hidden=!G.players.length;
  rmodal.hidden=false;
  document.getElementById('restartBack').focus();
}
function closeRestart(){ rmodal.hidden=true; }
document.getElementById('restartBtn').addEventListener('click',openRestart);
document.getElementById('restartBack').addEventListener('click',closeRestart);
document.getElementById('restartKeep').addEventListener('click',function(){
  var names=G.players.map(function(p){return p.name;});
  closeRestart(); busy=false; notice=''; closeWord();
  G=fresh(); G.players=names.map(function(n){return {name:n,score:0};});
  if(names.length>=2) startGame(); else go('register');
});
document.getElementById('restartAll').addEventListener('click',function(){
  closeRestart(); busy=false; notice=''; closeWord();
  G=fresh(); try{ localStorage.removeItem(KEY); }catch(e){}
  go('home');
});
document.addEventListener('visibilitychange',function(){ if(document.hidden && G.phase!=='home') save(); });
window.addEventListener('pagehide',function(){ if(G.phase!=='home') save(); });

render();
})();
</script>

</body></html>
